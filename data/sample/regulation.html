<body>
    <h1>Data Protection Regulation</h1>

    <h2>Data Retention</h2>
    <p>Personal data must not be retained for longer than necessary.</p>

    <h2>Data Access</h2>
    <p>Individuals have the right to request access to their personal data.</p>

    <h2>Security</h2>
    <p>Organizations must implement appropriate security measures to protect personal data.</p>
